[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-eval-platform"
version = "0.1.0"
description = "Reproducible Anima / Krea2 checkpoint evaluation on AutoDL"
requires-python = ">=3.10"
dependencies = ["Pillow>=10", "fastapi==0.116.1", "uvicorn==0.35.0", "requests>=2.32", "reportlab>=4.4,<5"]

[project.scripts]
evalctl = "eval_platform.cli:main"

[project.optional-dependencies]
test = ["pypdf>=5", "httpx>=0.27"]

[tool.setuptools.package-data]
eval_platform = ["static/*", "assets/fonts/*"]

[tool.setuptools.packages.find]
include = ["eval_platform*"]
